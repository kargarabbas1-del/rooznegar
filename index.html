<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f172a"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css">
  <title>روزنگار | مرکز فرماندهی روز</title>
</head>
<body>
<header class="topbar">
  <div class="topbar-start"><button id="menuBtn" class="icon-button" aria-label="باز کردن تنظیمات" aria-expanded="false">☰</button><button id="themeBtn" class="icon-button" aria-label="تغییر پوسته">☾</button></div>
  <div class="brand">روزنگار <small>مرکز فرماندهی زندگی</small></div>
  <button id="todayBtn" class="today-button">امروز</button>
</header>
<div id="drawerBackdrop" class="drawer-backdrop" hidden></div>
<aside id="settingsDrawer" class="settings-drawer" aria-hidden="true">
  <div class="drawer-head"><h2>تنظیمات و ابزارها</h2><button id="drawerClose" class="icon-button" aria-label="بستن">×</button></div>
  <section class="drawer-section"><h3>حساب کاربری</h3><div id="drawerCloudMount"></div></section>
  <section class="drawer-section"><h3>پشتیبان‌گیری</h3><div class="drawer-actions"><button id="exportBtn" class="secondary">دانلود بکاپ JSON</button><label class="secondary import">بازیابی فایل بکاپ<input id="importFile" type="file" accept=".json,application/json"></label></div></section>
  <section class="drawer-section about"><h3>دربارهٔ روزنگار</h3><p>برنامه‌ریزی، ژورنال، عادت‌ها و مرور روزانه</p><small>نسخه ۱۰ · ذخیره‌سازی محلی و ابری</small></section>
</aside>
<div class="shell"><aside class="sidebar"><div class="nav-title">منوی اصلی</div><nav class="nav-scroller" aria-label="ناوبری اصلی"><button class="nav active" data-view="today">🏠 امروز</button><button class="nav" data-view="calendar">🗓 تقویم</button><button class="nav" data-view="tasks">✅ همه کارها</button><button class="nav" data-view="timebox">⏱ تایم‌باکس</button><button class="nav" data-view="journal">✍️ ژورنال</button><button class="nav" data-view="habits">🌱 عادت‌ها</button><button class="nav" data-view="reports">📊 گزارش‌ها</button><button class="nav" data-view="gratitude">🙏 شکرگزاری</button><button class="nav" data-view="ideas">💡 ایده‌ها</button></nav><div class="storage">✓ ذخیره‌سازی محلی فعال<br><span>بدون نیاز به حساب کاربری</span></div></aside><main id="app"></main></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div><script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script defer src="app.js"></script><script defer src="cloud-sync.js"></script><script>if('serviceWorker' in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));</script>
</body></html>
